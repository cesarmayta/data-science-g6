{% block content %}
<div class="container mt-5" style="max-width:500px;">

    <h3 class="mb-4">Registro de Agente</h3>

    <form method="post">
        {% csrf_token %}

        {{ form|crispy }}

        <button class="btn btn-dark w-100">Registrarse</button>

    </form>

</div>
{% endblock %}
