{% extends 'portal/base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container mt-5" style="max-width:600px;">

    <h3 class="mb-4">Publicar Inmueble</h3>

    <form method="post">
        {% csrf_token %}

        {{ form|crispy }}

        <button class="btn btn-dark w-100">
            Guardar Inmueble
        </button>

    </form>

</div>
{% endblock %}
