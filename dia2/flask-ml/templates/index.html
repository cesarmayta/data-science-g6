<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcula el precio de tu casa con IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            line-height: 1.3;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .checkbox-hidden {
            display: none;
        }

        .button-container {
            display: flex;
            gap: 10px;
        }

        .calculate-btn {
            flex: 1;
            padding: 14px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .calculate-btn:active {
            transform: translateY(0);
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .checkbox-hidden:checked ~ .modal-overlay {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .modal-content p {
            color: #666;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .price-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .price-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .price-value {
            font-size: 48px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }

        .close-btn {
            width: 100%;
            padding: 12px 20px;
            background: #f0f0f0;
            color: #333;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .close-btn:hover {
            background: #e0e0e0;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .modal-content {
                padding: 30px 20px;
            }

            .price-value {
                font-size: 40px;
            }
        }

        @media (max-width: 400px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 20px;
                margin-bottom: 20px;
            }

            .calculate-btn {
                font-size: 14px;
                padding: 12px 15px;
            }

            .price-value {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <input type="checkbox" id="modalToggle" class="checkbox-hidden">
    
    <div class="container">
        <h1>Calcula el precio de tu casa con IA</h1>
        
        <form action="/" method="POST">
            <div class="form-group">
                <label for="habitaciones">Número de habitaciones</label>
                <input 
                    type="number" 
                    id="habitaciones" 
                    name="rooms" 
                    min="1" 
                    max="20" 
                    placeholder="Ej: 3"
                    required
                >
            </div>

            <div class="button-container">
                <input type="submit" value="Calcular precio con IA" class="calculate-btn"/>
            </div>
        </form>
        
        {% if precio %}
        <hr/>
            <h2>Precio estimado</h2>
            <p>Basado en el análisis de IA</p>
            
            <div class="price-display">
                <div class="price-label">Precio de tu casa</div>
                <div class="price-value">$ {{precio}}</div>
            </div>
        {% endif %}
    </div>
</body>
</html>
